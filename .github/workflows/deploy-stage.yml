# Deploy stage: on push to dev, CI checks → stage's D1 migrations → deploy vidflare-stage.
# (Production has its own workflow, deploy-production.yml; PR previews are in preview.yml.)
#
# Migrations run before the new code is deployed, so each one must work with the code that
# is still live (add columns/tables first, remove them in a later release).
#
# Setup (docs/CloudflareSetup.md → CI): secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# SENTRY_AUTH_TOKEN; variables STAGE_TURNSTILE_SITE_KEY, STAGE_SENTRY_DSN, SENTRY_ORG,
# SENTRY_PROJECT. Real stage resource ids must be in wrangler.jsonc.
#
# Release = git sha: the client build gets VITE_RELEASE, the Worker gets `--tag`, and the
# Sentry Vite plugin uploads (then deletes) hidden source maps under the same release.
name: Deploy stage

on:
  push:
    branches: [dev]

permissions:
  contents: read

# One stage deploy at a time; never cancel one halfway, queue instead.
concurrency:
  group: deploy-stage
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy stage
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: stage
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v7

      - name: Check resource ids
        if: steps.gate.outputs.enabled == 'true'
        run: |
          if grep -q '<stage .* id from scripts/setup-cloudflare.sh>' apps/web/wrangler.jsonc; then
            echo "::error::wrangler.jsonc still has stage placeholders. Run 'pnpm --filter web cf:setup stage' and commit the ids."
            exit 1
          fi

      - if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@v6

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations
        if: steps.gate.outputs.enabled == 'true'
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations apply vidflare-db-stage --remote --env stage

      # Build with the env baked in, uploading source maps to Sentry when SENTRY_AUTH_TOKEN is set.
      - name: Build
        if: steps.gate.outputs.enabled == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_ENV: stage
          VITE_TURNSTILE_SITE_KEY: ${{ vars.STAGE_TURNSTILE_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ vars.STAGE_SENTRY_DSN }}
          VITE_RELEASE: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: pnpm run build

      # --tag makes the Worker report the same release (git sha) as the client build.
      - name: Deploy
        if: steps.gate.outputs.enabled == 'true'
        working-directory: apps/web
        run: pnpm exec wrangler deploy --tag "$GITHUB_SHA"
