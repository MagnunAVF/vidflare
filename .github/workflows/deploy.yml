# Branch → environment: push to dev deploys stage, push to main deploys production.
# Each run: CI checks → D1 migrations for that environment → deploy. (PRs only get preview
# versions of stage, see preview.yml.)
#
# Migrations run before the new code is deployed, so each one must work with the code that
# is still live (add columns/tables first, remove them in a later release).
#
# Setup (docs/CloudflareSetup.md → CI): repository secrets CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID and SENTRY_AUTH_TOKEN; repository variables
# {STAGE,PRODUCTION}_TURNSTILE_SITE_KEY, {STAGE,PRODUCTION}_SENTRY_DSN, SENTRY_ORG and
# SENTRY_PROJECT; a GitHub environment named "production" (add required reviewers there to
# gate production deploys). Real resource ids must be in wrangler.jsonc.
#
# Release = git sha: the client build gets VITE_RELEASE, the Worker gets `--tag`, and the
# Sentry Vite plugin uploads (then deletes) hidden source maps under the same release.
name: Deploy

on:
  push:
    branches: [dev, main]

permissions:
  contents: read

# One deploy at a time per branch (= per environment); never cancel one halfway, queue instead.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  stage:
    name: Deploy stage
    if: github.ref == 'refs/heads/dev'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: stage
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v7

      - name: Check resource ids
        if: steps.gate.outputs.enabled == 'true'
        run: |
          if grep -q '<stage .* id from scripts/setup-cloudflare.sh>' apps/web/wrangler.jsonc; then
            echo "::error::wrangler.jsonc still has stage placeholders. Run 'pnpm --filter web cf:setup stage' and commit the ids."
            exit 1
          fi

      - if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@v6

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations
        if: steps.gate.outputs.enabled == 'true'
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations apply vidflare-db-stage --remote --env stage

      # Build with the env baked in, uploading source maps to Sentry when SENTRY_AUTH_TOKEN is set.
      - name: Build
        if: steps.gate.outputs.enabled == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_ENV: stage
          VITE_TURNSTILE_SITE_KEY: ${{ vars.STAGE_TURNSTILE_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ vars.STAGE_SENTRY_DSN }}
          VITE_RELEASE: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: pnpm run build

      # --tag makes the Worker report the same release (git sha) as the client build.
      - name: Deploy
        if: steps.gate.outputs.enabled == 'true'
        working-directory: apps/web
        run: pnpm exec wrangler deploy --tag "$GITHUB_SHA"

  production:
    name: Deploy production
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v7

      - name: Check resource ids
        if: steps.gate.outputs.enabled == 'true'
        run: |
          if grep -q '<production .* id from scripts/setup-cloudflare.sh>' apps/web/wrangler.jsonc; then
            echo "::error::wrangler.jsonc still has production placeholders. Run 'pnpm --filter web cf:setup production' and commit the ids."
            exit 1
          fi

      - if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@v6

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations
        if: steps.gate.outputs.enabled == 'true'
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations apply vidflare-db-production --remote --env production

      - name: Build
        if: steps.gate.outputs.enabled == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_ENV: production
          VITE_TURNSTILE_SITE_KEY: ${{ vars.PRODUCTION_TURNSTILE_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ vars.PRODUCTION_SENTRY_DSN }}
          VITE_RELEASE: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: pnpm run build

      - name: Deploy
        if: steps.gate.outputs.enabled == 'true'
        working-directory: apps/web
        run: pnpm exec wrangler deploy --tag "$GITHUB_SHA"
